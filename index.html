<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal collection of articles and documents, displayed in a clean and simple interface.">
    <title>My Article Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <header>
                <h1>Articles</h1>
                <p class="subtitle">Latest updates</p>
                <button id="new-article-btn" class="btn-primary">Write Article</button>
            </header>
            <nav id="article-list" class="article-list">
                <!-- Articles will be injected here -->
                <div class="loading">Loading articles...</div>
            </nav>
        </aside>
        <main class="content">
            <div id="empty-state" class="empty-state">
                <h2>Select an article to read</h2>
                <p>Choose a document from the sidebar to view it here.</p>
            </div>
            <iframe id="pdf-viewer" class="pdf-viewer hidden" src="" frameborder="0"></iframe>

            <!-- Editor Container -->
            <div id="editor-container" class="editor-container hidden">
                <div class="editor-header">
                    <input type="text" id="article-title" placeholder="Article Title" class="title-input">
                    <div class="editor-actions">
                        <button id="cancel-btn" class="btn-secondary">Cancel</button>
                        <button id="save-btn" class="btn-primary">Save PDF</button>
                    </div>
                </div>
                <div id="editor"></div>
            </div>
        </main>
    </div>
    <!-- Libraries -->
    <script src="   https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
